<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>ระบบลางานพนักงาน</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f6f8;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 16px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .welcome {
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: bold;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    select,
    input,
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .days {
      margin-top: 15px;
      padding: 12px;
      background: #f1f3f5;
      border-radius: 8px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      cursor: pointer;
    }

    #submitBtn {
      background: #06c755;
      color: white;
    }

    #status {
      text-align: center;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>ระบบลางานพนักงาน / Employee Leave System</h2>

  <div id="status">
    กำลังเชื่อมต่อ LINE... / Connecting to LINE...
  </div>

  <div id="formArea" style="display:none;">

    <div class="welcome">
      สวัสดีคุณ / Welcome 
      <span id="displayName"></span>
    </div>

    <label for="leaveType">
      ประเภทการลา / Leave Type
    </label>

    <select id="leaveType">

      <option value="">
        -- เลือกประเภทการลา / Select Leave Type --
      </option>

      <option value="ลาป่วย">
        ลาป่วย / Sick Leave
      </option>

      <option value="ลากิจ">
        ลากิจ / Personal Leave
      </option>

      <option value="ลาพักร้อน">
        ลาพักร้อน / Annual Leave
      </option>

      <option value="ลาคลอด">
        ลาคลอด / Maternity Leave
      </option>

      <option value="ลาสมรส">
        ลาสมรส / Marriage Leave
      </option>

      <option value="ลากิจศพครอบครัว">
        ลากิจศพครอบครัว / Family Member Death Leave
      </option>

      <option value="ลากิจฉุกเฉิน">
        ลากิจฉุกเฉิน / Special Case
      </option>

      <option value="ลาเกณฑ์ทหาร">
        ลาเกณฑ์ทหาร / Military Leave
      </option>

      <option value="ลาบวช">
        ลาบวช / Priesthood Leave
      </option>

    </select>

    <label for="startDate">
      วันที่เริ่มลา / Start Date
    </label>

    <input
      type="date"
      id="startDate"
    >

    <label for="endDate">
      วันที่สิ้นสุด / End Date
    </label>

    <input
      type="date"
      id="endDate"
    >

    <div class="days">
      จำนวนวันลา / Leave Days:
      <strong>
        <span id="leaveDays">0</span> วัน / Day(s)
      </strong>
    </div>

    <label for="reason">
      เหตุผล / Reason
    </label>

    <textarea
      id="reason"
      placeholder="กรุณาระบุเหตุผลการลา / Please enter the reason for leave"
    ></textarea>

    <button id="submitBtn">
      ส่งใบลา / Submit Leave Request
    </button>

  </div>

</div>

<script>

const LIFF_ID = "2011223159-lCWXwrUH";

let lineProfile = null;


/* =========================
   เริ่มต้น LIFF
========================= */

async function main() {

  const status = document.getElementById("status");

  try {

    await liff.init({
      liffId: LIFF_ID
    });

    console.log("LIFF initialized");

    if (!liff.isLoggedIn()) {

      liff.login();

      return;
    }
    lineProfile = await liff.getProfile();

    console.log("LINE Profile:", lineProfile);

    document.getElementById("displayName").textContent =
      lineProfile.displayName || "ผู้ใช้งาน";

    status.style.display = "none";

    document.getElementById("formArea").style.display = "block";

  } catch (error) {

    console.error(error);

    status.innerHTML =
      "เกิดข้อผิดพลาดในการเชื่อมต่อ LINE<br><br>" +
      error.message;

  }

}


/* =========================
   คำนวณจำนวนวันลา
========================= */

function calculateLeaveDays() {

  const start =
    document.getElementById("startDate").value;

  const end =
    document.getElementById("endDate").value;

  if (!start || !end) {

    document.getElementById("leaveDays").textContent = "0";

    return;
  }

  const startDate = new Date(start);
  const endDate = new Date(end);

  if (endDate < startDate) {

    document.getElementById("leaveDays").textContent = "0";

    return;
  }

  const difference =
    endDate - startDate;

  const days =
    Math.floor(
      difference / (1000 * 60 * 60 * 24)
    ) + 1;

  document.getElementById("leaveDays").textContent =
    days;

}


document
  .getElementById("startDate")
  .addEventListener("change", calculateLeaveDays);

document
  .getElementById("endDate")
  .addEventListener("change", calculateLeaveDays);


/* =========================
   ส่งใบลา
========================= */

document
  .getElementById("submitBtn")
  .addEventListener("click", async function() {

    const leaveType =
      document.getElementById("leaveType").value;

    const startDate =
      document.getElementById("startDate").value;

    const endDate =
      document.getElementById("endDate").value;

    const reason =
      document.getElementById("reason").value.trim();

    const leaveDays =
      document.getElementById("leaveDays").textContent;


    if (!leaveType) {
      alert(
        "กรุณาเลือกประเภทการลา\n" +
        "Please select a leave type"
      );
      return;
    }

    if (!startDate || !endDate) {
      alert(
        "กรุณาเลือกวันที่ลา\n" +
        "Please select the leave dates"
      );
      return;
    }

    if (Number(leaveDays) <= 0) {
      alert(
        "วันที่สิ้นสุดต้องไม่ก่อนวันที่เริ่มลา\n" +
        "End date cannot be earlier than start date"
      );
      return;
    }

    if (!reason) {
      alert(
        "กรุณาระบุเหตุผลการลา\n" +
        "Please enter the reason for leave"
      );
      return;
    }


    const API_URL =
  "https://script.google.com/macros/s/AKfycbx7TtRsa7zCVYkGifVczsplPKudx_QOvq52v6GCsdow2Lgf8-7HNSZKmNaoiIGphcBv/exec";

const data = {
  action: "submitLeave",
  userId: lineProfile.userId,
  displayName: lineProfile.displayName,
  leaveType: leaveType,
  startDate: startDate,
  endDate: endDate,
  leaveDays: Number(leaveDays),
  reason: reason
};

const button = document.getElementById("submitBtn");

button.disabled = true;
button.textContent = 
  "กำลังส่งใบลา... / Submitting...";

try {

  const response = await fetch(API_URL, {
    method: "POST",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify(data)
  });

  const result = await response.json();

  if (result.success) {

    alert(
      "ส่งใบลาเรียบร้อยแล้วค่ะ\n" +
      "Leave request submitted successfully."
    );

    document.getElementById("leaveType").value = "";
    document.getElementById("startDate").value = "";
    document.getElementById("endDate").value = "";
    document.getElementById("reason").value = "";
    document.getElementById("leaveDays").textContent = "0";

  } else {

    alert(
      "ไม่สามารถส่งใบลาได้\n" +
      "Unable to submit leave request.\n\n" +
      result.message
    );

  }

} catch (error) {

  console.error(error);

  alert(
    "เกิดข้อผิดพลาดในการส่งใบลา\n" +
    "An error occurred while submitting the leave request.\n\n" +
    error.message
  );

} finally {

  button.disabled = false;
  button.textContent = 
    "ส่งใบลา / Submit Leave Request";

}

  });


main();

</script>

</body>
</html>
